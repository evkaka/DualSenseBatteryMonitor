name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Release
        run: dotnet publish DualSenseBatteryMonitor.csproj -c Release -r win-x86 --self-contained false -o ./publish
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualSenseBatteryMonitor-PS5-HUD
          path: ./publish
